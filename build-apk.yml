name: Compilar VetCore APK Nativo

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Clonar Repositório
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: 📱 Instalar Capacitor e Ferramentas Android
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: 🚀 Inicializar Capacitor para Android
        run: |
          npx cap init VetCore com.vetcore.app --web-dir .
          npx cap add android

      - name: 🔨 Compilar APK no Android Studio (Gradle)
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Salvar APK gerado para Download
        uses: actions/upload-artifact@v4
        with:
          name: VetCore-APK-Nativo
          path: android/app/build/outputs/apk/debug/app-debug.apk