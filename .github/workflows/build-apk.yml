name: Gerar APK Nativo VetCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21 (Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar arquivos web e gerar CSS 100% offline
        run: |
          mkdir -p www assets
          cp index.html style.css database.js app.js icon.png manifest.json www/
          cp icon.png assets/icon.png
          cp icon.png assets/splash.png
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install -D @capacitor/assets tailwindcss@3.4.17

          cat << 'EOF' > tailwind.config.js
          module.exports = {
            content: ["./www/**/*.{html,js}"],
            theme: { extend: {} },
            plugins: []
          };
          EOF
          printf "@tailwind base;\n@tailwind components;\n@tailwind utilities;\n" > input.css
          npx tailwindcss -i input.css -o www/tailwind.min.css --minify
          sed -i 's|<script src="https://cdn.tailwindcss.com"></script>|<link rel="stylesheet" href="./tailwind.min.css">|g' www/index.html

      - name: Inicializar Capacitor Android e Gerar Ícones Nativos
        run: |
          npx cap init "VetCore" "br.com.vetcore.app" --web-dir www
          npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Align Kotlin dependencies (Fix Duplicate Classes)
        run: |
          printf "\ndependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')\n}\n" >> android/app/build.gradle

      - name: Compilar APK Android Nativo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar VetCore.apk para Download
        uses: actions/upload-artifact@v4
        with:
          name: VetCore-APK-Nativo
          path: android/app/build/outputs/apk/debug/app-debug.apk
