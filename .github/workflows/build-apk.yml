
name: Compilar VetCore APK Nativo

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Clonar Repositório
        uses: actions/checkout@v7

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: ☕ Configurar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 🤖 Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 📱 Instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@8.6.2 @capacitor/cli@8.6.2 @capacitor/android@8.6.2

      - name: 🚀 Configurar Capacitor
        run: |
          npx cap init VetCore com.vetcore.app --web-dir "."

      - name: 📲 Adicionar Android
        run: |
          npx cap add android
          npx cap sync android

      - name: 🔨 Compilar APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: 📤 Disponibilizar APK
        uses: actions/upload-artifact@v7
        with:
          name: VetCore-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
