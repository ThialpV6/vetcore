name: Gerar APK Nativo VetCore

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21 (Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Preparar arquivos web e Capacitor Android
        run: |
          mkdir -p www
          cp index.html database.js app.js icon.png www/
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "VetCore" "br.com.vetcore.app" --web-dir www
          npx cap add android

      - name: Align Kotlin dependencies (Fix Duplicate Classes)
        run: |
          printf "\ndependencies {\n    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')\n}\n" >> android/app/build.gradle

      - name: Aplicar ícone e cores nativas (#0B0F17)
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp icon.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png || true
          cp icon.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png || true

      - name: Compilar APK Android Nativo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar VetCore.apk para Download
        uses: actions/upload-artifact@v4
        with:
          name: VetCore-APK-Nativo
          path: android/app/build/outputs/apk/debug/app-debug.apk
